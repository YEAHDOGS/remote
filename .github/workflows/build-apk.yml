name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Kotlin brace/paren balance guard
        run: python3 tools/check-braces.py
        # Fails fast on unbalanced delimiters before the slow Gradle build.
        # Guards against the stray-brace class of build break (2026-09-09 saga).

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dogs-remote-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
